<!doctype html>

<div class="mk" style="font-family: 'Satoshi', system-ui, sans-serif; color: #13201B; background: #FFFFFF;">

        <label style="flex: 1 1 160px; display: flex; flex-direction: column; gap: 2px; padding: 10px 18px;">
          <span style="font-size: 12px; font-weight: 700;">Where</span>
          <input value="Lekki, Lagos" style="border: 0; outline: 0; font-size: 16px; color: #13201B; background: transparent; padding: 0;">
        </label>
        <span style="width: 1px; background: #E6EBE7; margin: 12px 0;"></span>
        <label style="flex: 1 1 160px; display: flex; flex-direction: column; gap: 2px; padding: 10px 18px;">
          <span style="font-size: 12px; font-weight: 700;">When</span>

    <div style="display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap;">

        <div style="font-size: 14px; color: #4A5A52; margin-top: 4px;">126 places in Lekki, Lagos · sorted by recommended</div>

      <div style="display: flex; gap: 8px; flex-wrap: wrap; align-items: center;">
        <button style="height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid #0E3B2E; background: #E6F4EC; color: #0E3B2E; font-size: 14px; font-weight: 600;">Open now</button>

        <button style="height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid #DDE3DE; background: #FFFFFF; color: #13201B; font-size: 14px;">Price</button>

      </div>
    </div>

    <!-- Results -->
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 32px 24px;">
      <sc-for list="{{venues}}" as="v" hint-placeholder-count="9">
        <article class="card" style="display: flex; flex-direction: column; gap: 12px;">
          <a href="Main.dc.html" class="ph" style="height: 220px; border-radius: 20px; overflow: hidden; background: {{v.bg}}; position: relative; transition: box-shadow .2s; display: grid; place-items: center; text-decoration: none;">
            <sc-if value="{{v.photo}}" hint-placeholder-val="{{false}}"><img src="/_blob/cdf24fbcb8d78ab34151bc7182d1ad42" alt="Glow House studio" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 55% 40%;"></sc-if>
            <sc-if value="{{v.noPhoto}}" hint-placeholder-val="{{true}}"><span style="font-size: 48px; font-weight: 700; color: {{v.fg}}; letter-spacing: -0.02em;">{{v.mono}}</span></sc-if>
            <sc-if value="{{v.home}}" hint-placeholder-val="{{false}}"><span style="position: absolute; left: 12px; top: 12px; background: #FFFFFF; color: #0E3B2E; font-size: 12px; font-weight: 700; padding: 5px 10px; border-radius: 999px;">Home service</span></sc-if>

          <button aria-label="Save {{v.name}}" style="position: relative; margin-top: -60px; margin-left: auto; margin-right: 12px; width: 40px; height: 40px; border-radius: 999px; border: 0; background: #FFFFFF; display: grid; place-items: center; box-shadow: 0 2px 8px rgba(0,0,0,.12);"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#13201B" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7.5-4.6-9.2-9.3C1.6 7.3 4 4 7.3 4c2 0 3.6 1.1 4.7 2.7C13.1 5.1 14.7 4 16.7 4 20 4 22.4 7.3 21.2 10.7 19.5 15.4 12 20 12 20z"></path></svg></button>
          <div style="display: flex; justify-content: space-between; gap: 8px; align-items: baseline; margin-top: 8px;">
            <a href="Main.dc.html" style="font-size: 17px; font-weight: 700; color: #13201B; text-decoration: none;">{{v.name}}</a>
            <span style="display: flex; align-items: center; gap: 4px; font-size: 14px; white-space: nowrap;"><strong>{{v.rating}}</strong><svg width="13" height="13" viewBox="0 0 24 24" fill="#13201B" aria-hidden="true"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3 6.1 20.6l1.3-6.6L2.5 9.4l6.6-.8z"></path></svg><span style="color: #4A5A52;">({{v.count}})</span></span>

          <div style="font-size: 14px; color: #4A5A52; margin-top: -6px;">{{v.area}} · {{v.distance}} · from <strong style="color: #13201B;">{{v.from}}</strong></div>
          <div style="display: flex; gap: 6px; flex-wrap: wrap;">
            <sc-for list="{{v.slots}}" as="t" hint-placeholder-count="3">
              <a href="Booking.dc.html" class="slot" style="height: 34px; padding: 0 12px; border-radius: 999px; border: 1px solid #DDE3DE; font-size: 13px; font-weight: 600; color: #13201B; text-decoration: none; display: flex; align-items: center;">{{t}}</a>
            </sc-for>
          </div>
        </article>
      </sc-for>
    </div>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 16px 0 0;">
      <div style="width: 240px; height: 4px; border-radius: 99px; background: #E6EBE7; overflow: hidden;"><div style="width: 7%; height: 100%; background: #0E3B2E;"></div></div>
      <span style="font-size: 14px; color: #4A5A52;">Showing 9 of 126</span>
      <button style="height: 48px; padding: 0 28px; border-radius: 999px; border: 1px solid #DDE3DE; background: #FFFFFF; font-size: 15px; font-weight: 700; color: #13201B;">Show more</button>
    </div>
  </main>

  <div style="height: 104px;"></div>
  <dc-import name="SiteFooter" hint-size="100%,640px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":2700}}'>
class Component extends DCLogic {

      cats,
      heading: heads[cat],
      query: cat === 'All' ? 'All treatments' : cat,
