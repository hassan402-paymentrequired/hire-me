<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["bookings","wallet","favourites","settings"],"default":"bookings"},"$preview":{"width":280,"height":560}}'>
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active ?? 'bookings';
    const st = (key) => a === key
      ? { bg: '#0E3B2E', fg: '#FFFFFF', icon: '#C8F169', badgeBg: '#C8F169', badgeFg: '#0E3B2E' }
      : { bg: 'transparent', fg: '#13201B', icon: '#4A5A52', badgeBg: '#E6F4EC', badgeFg: '#0E3B2E' };
    return { b: st('bookings'), w: st('wallet'), f: st('favourites'), s: st('settings') };
  }
}
