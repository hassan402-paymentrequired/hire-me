<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Site navbar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@500..800&amp;display=swap">
<style>
@font-face{font-family:'Satoshi';src:url('/_blob/aa99b90ef361c613c9d43e57b82b3414') format('woff2');font-weight:300 900;font-style:normal;font-display:swap}
body{margin:0}
</style>
</helmet>
<header style="font-family: 'Satoshi', system-ui, sans-serif; color: {{fg}}; background: {{bg}}; border-bottom: 1px solid {{line}}; box-sizing: border-box; width: 100%;">
  <div style="max-width: 1240px; margin: 0 auto; padding: 16px 24px; display: flex; align-items: center; gap: 28px; flex-wrap: wrap; box-sizing: border-box;">
    <a href="Welcome.dc.html" aria-label="Proxideck home" style="display: flex; align-items: center; text-decoration: none;">
      <span style="display: inline-flex; align-items: center; gap: 10px;"><svg width="28" height="28" viewBox="0 0 48 48" aria-hidden="true"><path d="M4 24a20 20 0 0 1 40 0z" fill="{{fg}}"></path><path d="M10 30H38" stroke="{{fg}}" stroke-width="5" stroke-linecap="round"></path><path d="M16 38H32" stroke="{{fg}}" stroke-width="5" stroke-linecap="round"></path></svg><span style="font-family: Geist, Satoshi, sans-serif; font-weight: 650; font-size: 24px; letter-spacing: -0.02em; color: {{fg}};">Proxideck</span></span>
    </a>

    <!-- Guest -->
    <sc-if value="{{guest}}" hint-placeholder-val="{{true}}">
      <nav aria-label="Main" style="margin-left: auto; display: flex; align-items: center; gap: 4px; flex-wrap: wrap;">
        <a href="Marketplace.dc.html" style="font-size: 15px; font-weight: 500; text-decoration: none; padding: 10px 14px; color: {{fg}};">Explore</a>
        <a href="#" style="font-size: 15px; font-weight: 500; text-decoration: none; padding: 10px 14px; color: {{fg}};">For business</a>
        <a href="Contact.dc.html" style="font-size: 15px; font-weight: 500; text-decoration: none; padding: 10px 14px; color: {{fg}};">Help</a>
        <a href="#" style="font-size: 15px; font-weight: 600; text-decoration: none; padding: 10px 18px; margin-left: 8px; border: 1px solid {{btnLine}}; border-radius: 999px; color: {{fg}};">Log in</a>
        <a href="#" style="font-size: 15px; font-weight: 700; text-decoration: none; padding: 11px 20px; margin-left: 4px; border-radius: 999px; background: #C8F169; color: #0E3B2E;">Sign up</a>
      </nav>
    </sc-if>

    <!-- Signed in -->
    <sc-if value="{{user}}" hint-placeholder-val="{{false}}">
      <nav aria-label="Main" style="display: flex; align-items: center; gap: 4px;">
        <a href="Marketplace.dc.html" style="font-size: 15px; font-weight: 500; text-decoration: none; padding: 10px 14px; color: {{fg}};">Explore</a>
        <a href="Bookings.dc.html" style="font-size: 15px; font-weight: 500; text-decoration: none; padding: 10px 14px; color: {{fg}};">My bookings</a>
        <a href="Favourites.dc.html" style="font-size: 15px; font-weight: 500; text-decoration: none; padding: 10px 14px; color: {{fg}};">Favourites</a>
      </nav>
      <div style="margin-left: auto; display: flex; align-items: center; gap: 10px;">
        <a href="Wallet.dc.html" aria-label="Wallet balance ₦42,500" style="height: 44px; padding: 0 14px 0 6px; border-radius: 999px; border: 1px solid {{btnLine}}; display: flex; align-items: center; gap: 8px; text-decoration: none; color: {{fg}}; font-size: 15px; font-weight: 700;">
          <span style="width: 32px; height: 32px; border-radius: 999px; background: #C8F169; display: grid; place-items: center;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0E3B2E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="3"></rect><path d="M3 10h18M16 14.5h2"></path></svg></span>₦42,500
        </a>
        <button aria-label="Notifications, 2 new" style="width: 44px; height: 44px; border-radius: 999px; border: 1px solid {{btnLine}}; background: transparent; display: grid; place-items: center; position: relative; cursor: pointer;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{fg}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0112 0c0 7 3 8 3 8H3s3-1 3-8"></path><path d="M10 20a2 2 0 004 0"></path></svg>
          <span style="position: absolute; top: 9px; right: 10px; width: 9px; height: 9px; border-radius: 99px; background: #E5484D; border: 2px solid {{dotRing}};"></span>
        </button>
        <a href="Settings.dc.html" aria-label="Account menu" style="height: 44px; padding: 0 12px 0 4px; border-radius: 999px; border: 1px solid {{btnLine}}; display: flex; align-items: center; gap: 8px; text-decoration: none; color: {{fg}}; font-size: 15px; font-weight: 600;">
          <span style="width: 36px; height: 36px; border-radius: 999px; background: #0E3B2E; color: #C8F169; border: 2px solid #C8F169; display: grid; place-items: center; font-size: 13px; font-weight: 700; box-sizing: border-box;">TA</span>Tolu
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="{{fg}}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
        </a>
      </div>
    </sc-if>
  </div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"variant":{"editor":"enum","options":["light","dark"],"default":"light"},"auth":{"editor":"enum","options":["guest","user"],"default":"guest"},"$preview":{"width":1440,"height":80}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = (this.props.variant ?? 'light') === 'dark';
    const user = (this.props.auth ?? 'guest') === 'user';
    return {
      dark,
      light: !dark,
      user,
      guest: !user,
      fg: dark ? '#FFFFFF' : '#13201B',
      bg: dark ? 'transparent' : '#FFFFFF',
      line: dark ? 'rgba(255,255,255,0.10)' : '#E6EBE7',
      btnLine: dark ? 'rgba(255,255,255,0.35)' : '#DDE3DE',
      dotRing: dark ? '#0E3B2E' : '#FFFFFF'
    };
  }
}
</script>
</body>
</html>
